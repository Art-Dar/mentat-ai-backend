version = "0.1.0"
description = ""
authors = [
    {name = "OnishchenkoDaria",email = "daria.onishchenko.57@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
